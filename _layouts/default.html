<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.student.name | escape }} - Graduate Research Journey at CSDI Lab, NTUT">
  <title>{{ page.title | default: site.title | escape }} | {{ site.student.name | escape }}</title>
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">C</span> CSDI Lab <span class="brand-light">/ Student Journey</span></a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode" title="Toggle theme"><i class="theme-icon" aria-hidden="true"></i></button>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer">
      <span>{{ site.student.name | escape }} &middot; {{ site.student.lab | escape }} &middot; {{ site.student.university | escape }}</span>
      <span>Updated through GitHub</span>
    </footer>
  </div>
  <script>
    (function() {
      var button = document.getElementById('theme-toggle');
      button.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    })();
  </script>
</body>
</html>
