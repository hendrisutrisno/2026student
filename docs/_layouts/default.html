<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.student.name | escape }} - Graduate Research Journey at CSDI Lab, NTUT">
  <title>{{ page.title | default: site.title | escape }} | {{ site.student.name | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">C</span> CSDI Lab <span class="brand-light">/ Student Journey</span></a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/meetings/' | relative_url }}">Regular meetings</a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer">
      <span>{{ site.student.name | escape }} &middot; {{ site.student.lab | escape }} &middot; {{ site.student.university | escape }}</span>
      <span>Updated through GitHub</span>
    </footer>
  </div>
</body>
</html>
