# Graduate Research Journey — student site configuration
# Edit the student profile here. GitHub Pages supplies url and baseurl when publishing.
# Set url and baseurl below for local preview.
title: Graduate Research Journey
url: "https://hendrisutrisno.github.io"
baseurl: "/2026student"

collections:
  semesters:
    output: false
  showcases:
    output: true
    permalink: /showcase/:name/

defaults:
  - scope:
      path: ""
      type: showcases
    values:
      layout: default

student:
  name: "Lucas"
  email: "zac105437@gmail.com" # Replace with your address, or leave empty to hide.
  degree: "Master's Student"
  photo: /assets/photos/rec2025_1.png # Optional: uncomment and add your photo in docs/assets/photos/
  lab: "CSDI Lab"
  university: "National Taipei University of Technology"
  joined: "2026"
  interests: "To be determined"
  summary: "My graduate research journey: building skills, exploring questions, and developing research independence."

markdown: kramdown
exclude:
  - _site/
  - .jekyll-cache/
  - .sass-cache/
  - _templates/
  - assets/photos/README.md
