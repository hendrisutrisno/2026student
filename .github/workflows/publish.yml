name: Publish graduate journey

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reStructuredText and encryption dependencies
        run: python -m pip install 'docutils>=0.20,<0.23' 'cryptography>=43,<48'
      - name: Generate encrypted meeting pages
        env:
          MEETING_PASSWORD: ${{ secrets.MEETING_PASSWORD }}
        run: python scripts/build_protected_meetings.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build public Jekyll site from docs only
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
